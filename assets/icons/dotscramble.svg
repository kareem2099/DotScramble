    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2631"/>
      <stop offset="1" stop-color="#0b1015"/>
    </linearGradient>
    <linearGradient id="dot" gradientUnits="userSpaceOnUse" x1="50" y1="116" x2="330" y2="396">
      <stop offset="0" stop-color="#5ce1f2"/>
      <stop offset="1" stop-color="#00a5bf"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- left half: the intact dot -->
  <path d="M190 116A140 140 0 0 0 190 396Z" fill="url(#dot)"/>
