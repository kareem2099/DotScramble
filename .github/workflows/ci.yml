name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # the release workflow runs the same tests first
    secrets:
      LICENSE_MANAGER_PY_B64:
        required: false

permissions:
  contents: read

jobs:
  test:
    # Same image the release is built on, so tests and the shipped binary see the same libraries
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      LICENSE_B64: ${{ secrets.LICENSE_MANAGER_PY_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries
        timeout-minutes: 12
        run: |
          # man-db rebuilds its index after every install and can stall the runner for ages
          sudo rm -f /var/lib/man-db/auto-update
          # a stalled mirror download is dropped after 30 s and retried (applies to every apt call)
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 tesseract-ocr

      # license_manager.py is gitignored; the app (and so every test that imports it) needs it.
      # Secrets aren't given to pull requests from forks, so those runs skip the tests.
      - name: Private license module
        run: |
          if [ -z "$LICENSE_B64" ]; then
            echo "::notice::LICENSE_MANAGER_PY_B64 is not available here (e.g. a pull request from a fork): skipping tests."
            echo "SKIP_TESTS=1" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$LICENSE_B64" | base64 -d > src/managers/license_manager.py

      - name: Install
        if: env.SKIP_TESTS != '1'
        run: pip install -r requirements.txt pytest

      - name: Test
        if: env.SKIP_TESTS != '1'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ ! -d tests ]; then
            echo "::warning::tests/ is not in the repository (it is listed in .gitignore), so nothing was tested."
            exit 0
          fi
          pytest -q -p no:cacheprovider tests

      - name: Remove the license source
        if: always()
        run: rm -f src/managers/license_manager.py
