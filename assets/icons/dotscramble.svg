<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- DotScramble app icon: a dot whose right half breaks into scattering pixels.
       Used for 48px and up; dotscramble-small.svg is the simplified 16–32px cut.
       Regenerate all raster/.ico/.icns files with: python build_icons.py -->
