name: Release

# Push a tag like v1.5.0 to publish a GitHub Release with
#   DotScramble-Linux-x86_64.{AppImage,deb,pkg.tar.zst,tar.gz}, SHA256SUMS,
#   a detached .asc signature for each package, and the public signing key.
# The in-app updater (core/auto_updater.py) looks for exactly these asset names.
# DotScramble-Linux-x86_64.AppImage.zsync is for AppImageUpdate / Gear Lever: the AppImage
# embeds update information pointing at it (build.py APPIMAGE_UPDATE_INFO).
#
# Secrets (Settings → Secrets and variables → Actions):
#   LICENSE_MANAGER_PY_B64  base64 of src/managers/license_manager.py, which is gitignored.
#                           Restored only inside the job, compiled with Cython, then deleted.
#   GPG_PRIVATE_KEY         the armored FreeRave release key (GPG_PASSPHRASE if it has one,
#                           GPG_KEY_ID to pick a subkey). Without it the release is not
#                           published: the in-app updater refuses unsigned updates.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: every package is built,
# smoke-tested, summed and signed, and uploaded as the "release" artifact. Nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The release key the updater pins (core/auto_updater.py RELEASE_KEY_FINGERPRINT)
  RELEASE_KEY_FINGERPRINT: 0F0467813146DE68272EDC82145D345956DE18D2

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: test
    # A PyInstaller binary only runs where glibc is at least as new as the build machine's.
    # 22.04 (glibc 2.35) is the oldest image PySide6 6.12 runs on (manylinux_2_34), so this
    # reaches Ubuntu 22.04+, Debian 12+, Fedora 36+… instead of only bleeding-edge distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"  # no FUSE on the runner (appimagetool and the smoke test)
      LICENSE_B64: ${{ secrets.LICENSE_MANAGER_PY_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Tools
        timeout-minutes: 12
        run: |
          # man-db rebuilds its index after every install and can stall the runner for ages
          sudo rm -f /var/lib/man-db/auto-update
          # a stalled mirror download is dropped after 30 s and retried (applies to every apt call)
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 tesseract-ocr libarchive-tools zstd \
            zsync desktop-file-utils appstream
          pip install -r requirements.txt

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          info=$(python -c "import version_info; print(version_info.VERSION)")
          fallback=$(sed -n 's/^ *APP_VERSION = "\([^"]*\)".*/\1/p' src/config.py | head -1)
          echo "tag=$tag  version_info.py=$info  src/config.py fallback=$fallback"
          if [ "$tag" != "$info" ] || [ "$tag" != "$fallback" ]; then
            echo "::error::Bump version_info.py and the APP_VERSION fallback in src/config.py to $tag before tagging."
            exit 1
          fi

      - name: Compile the license module
        run: |
          if [ -z "$LICENSE_B64" ]; then
            echo "::error::The LICENSE_MANAGER_PY_B64 secret is not set, so the license module can't be built."
            exit 1
          fi
          printf '%s' "$LICENSE_B64" | base64 -d > src/managers/license_manager.py
          python setup_license.py build_ext --inplace
          ls -la src/managers/license_manager*.so

      - name: Build the packages
        run: python build.py --no-sign

      - name: Remove the license source
        if: always()
        run: rm -f src/managers/license_manager.py src/managers/license_manager.c

      - name: Inspect the packages
        run: |
          cd release
          ls -la
          dpkg-deb --info DotScramble-Linux-x86_64.deb
          dpkg-deb -c DotScramble-Linux-x86_64.deb | grep -q usr/share/dotscramble/DotScramble
          bsdtar -tf DotScramble-Linux-x86_64.pkg.tar.zst | grep -q '^\./\.PKGINFO$\|^\.PKGINFO$'
          tar -tzf DotScramble-Linux-x86_64.tar.gz | grep -qx DotScramble
          # the AppImage: update information, its .zsync, desktop entry and AppStream metainfo
          chmod +x DotScramble-Linux-x86_64.AppImage
          # read from the ELF section (with APPIMAGE_EXTRACT_AND_RUN, --appimage-updateinformation starts
          # the app instead). readelf only reads; objcopy would rewrite the file and drop the squashfs.
          info=$(readelf --string-dump=.upd_info DotScramble-Linux-x86_64.AppImage | sed -n 's/^ *\[ *0\] *//p')
          echo "update information: $info"
          case "$info" in gh-releases-zsync\|*\|DotScramble-Linux-x86_64.AppImage.zsync) ;; *) echo "::error::AppImage has no zsync update information"; exit 1 ;; esac
          grep -q '^URL: DotScramble-Linux-x86_64.AppImage$' DotScramble-Linux-x86_64.AppImage.zsync
          ./DotScramble-Linux-x86_64.AppImage --appimage-extract > /dev/null
          desktop-file-validate squashfs-root/DotScramble.desktop
          version=$(cd .. && python -c "import version_info; print(version_info.VERSION)")
          grep -q "<release version=\"$version\"" \
            squashfs-root/usr/share/metainfo/dev.dotsuite.DotScramble.appdata.xml
          appstreamcli validate --no-net squashfs-root/usr/share/metainfo/dev.dotsuite.DotScramble.appdata.xml \
            || echo "::warning::appstreamcli reported problems in the metainfo (see above)"
          rm -rf squashfs-root
          # the binary must carry the compiled license module and none of its readable forms
          pyi-archive_viewer -l -r DotScramble > contents.txt
          grep -q "license_manager\.cpython-.*\.so" contents.txt
          if grep -E "license_manager(\.py|\.c|\.cpython-[0-9]+\.pyc)'" contents.txt; then
            echo "::error::Readable license code is inside the binary (see the lines above)."
            exit 1
          fi
          rm contents.txt

      - name: AppImage smoke test
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          image="$PWD/release/DotScramble-Linux-x86_64.AppImage"
          chmod +x "$image"
          # its own HOME and working folder, so the app's logs/ and settings land outside release/
          mkdir -p "$RUNNER_TEMP/smoke/home"
          cd "$RUNNER_TEMP/smoke"
          # a healthy start keeps running until the timeout (exit 124)
          set +e
          HOME="$RUNNER_TEMP/smoke/home" timeout 40 "$image" > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          test "$code" = 124
          grep -q "Application initialized successfully" smoke.log

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          if-no-files-found: error
          path: |
            release/DotScramble-Linux-x86_64.AppImage
            release/DotScramble-Linux-x86_64.AppImage.zsync
            release/DotScramble-Linux-x86_64.deb
            release/DotScramble-Linux-x86_64.pkg.tar.zst
            release/DotScramble-Linux-x86_64.tar.gz

  release-files:
    # Collect the packages, write SHA256SUMS, sign every package (.asc), add the public key.
    # Only this job sees the signing key.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: release

      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # must be the key the in-app updater trusts, or every update would be rejected
          gpg --batch --with-colons --fingerprint | grep -q "^fpr:*$RELEASE_KEY_FINGERPRINT:" || {
            echo "::error::GPG_PRIVATE_KEY is not the release key $RELEASE_KEY_FINGERPRINT pinned in core/auto_updater.py."
            exit 1
          }

      - name: SHA256SUMS and signatures
        run: |
          cd release
          sha256sum DotScramble-Linux-x86_64.* > SHA256SUMS
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            for f in DotScramble-Linux-x86_64.*; do
              gpg --batch --yes --armor --detach-sign \
                ${GPG_PASSPHRASE:+--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE"} \
                --local-user "${GPG_KEY_ID:-$RELEASE_KEY_FINGERPRINT}" \
                --output "$f.asc" "$f"
            done
          else
            echo "::warning::GPG_PRIVATE_KEY is not set: no .asc signatures, so this run can't be published."
          fi
          cp ../public_key.asc DotScramble-signing-key.asc
          sha256sum -c SHA256SUMS
          for f in *.asc; do
            [ "$f" = DotScramble-signing-key.asc ] && continue
            gpg --batch --verify "$f" "${f%.asc}"
          done
          ls -la

      - name: Release notes
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"
          else version=$(python3 -c "import version_info; print(version_info.VERSION)"); fi
          # the "## [x.y.z]" section of CHANGELOG.md, up to the next version heading
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::CHANGELOG.md has no section for $version."
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > RELEASE_NOTES.md
          fi
          printf '\n---\nVerify a download: `sha256sum -c SHA256SUMS --ignore-missing` and `gpg --verify <file>.asc <file>` (key: DotScramble-signing-key.asc).\n' >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release/
            RELEASE_NOTES.md

  github-release:
    needs: release-files
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: .

      - name: Every file the in-app updater needs is here
        run: |
          missing=0
          for f in AppImage AppImage.zsync deb pkg.tar.zst tar.gz; do
            for asset in "DotScramble-Linux-x86_64.$f" "DotScramble-Linux-x86_64.$f.asc"; do
              [ -s "release/$asset" ] || { echo "::error::missing $asset"; missing=1; }
            done
          done
          [ -s release/SHA256SUMS ] || { echo "::error::missing SHA256SUMS"; missing=1; }
          exit $missing

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "DotScramble ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md release/*
